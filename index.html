<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A beautiful, fast weather dashboard with live forecasts and location search.">
    <title>Atmos — Weather Dashboard</title>
    <link rel="icon" href="./assets/weathericon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="preconnect" href="https://api.open-meteo.com">
    <link rel="preconnect" href="https://nominatim.openstreetmap.org">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="ambient-bg" aria-hidden="true"></div>

    <div class="page-center">
    <div class="app">
        <header class="app-header">
            <div class="brand">
                <img src="./assets/weathericon.png" alt="" class="brand-icon" width="28" height="28">
                <span class="brand-name">Atmos</span>
            </div>
            <button type="button" id="unit-toggle" class="unit-toggle" aria-label="Toggle temperature unit">
                °<span id="unit-label">C</span>
            </button>
        </header>

        <main class="dashboard">
            <section class="card hero-card" aria-label="Current weather">
                <form class="search-box" role="search">
                    <div class="search-input-wrap">
                        <input id="enter-city" type="search" placeholder="Search any city…" autocomplete="off"
                            aria-label="Search for a city">
                        <ul id="recent-searches" class="recent-searches" hidden></ul>
                    </div>
                    <button type="submit" id="search" class="btn-search">Search</button>
                    <button type="button" id="gps" class="btn-gps" aria-label="Use my location">
                        <img src="./assets/my-location-svgrepo-com.png" alt="" width="20" height="20">
                    </button>
                </form>

                <div class="hero-content" id="hero-content">
                    <div class="hero-main">
                        <h1 id="city-display" class="city-name">—</h1>
                        <p id="date" class="city-date"></p>
                        <p id="weather-desc" class="weather-desc"></p>
                        <div class="temp-row">
                            <span id="temp" class="temp-display">—°</span>
                            <span id="temp-range" class="temp-range"></span>
                        </div>
                    </div>
                    <div id="weather-icon" class="weather-icon" role="img" aria-label="Current weather icon"></div>
                </div>
            </section>

            <section class="card stats-card" aria-label="Air conditions">
                <h2 class="section-label">Air Conditions</h2>
                <div class="weather-stats">
                    <div class="stat">
                        <span class="stat-label">
                            <img class="stat-icon" src="./assets/temp-high-svgrepo-com.png" alt="" width="20" height="20">
                            Real Feel
                        </span>
                        <span class="stat-value" id="real-feel">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">
                            <img class="stat-icon" src="./assets/wind-svgrepo-com.png" alt="" width="20" height="20">
                            Wind
                        </span>
                        <span class="stat-value" id="wind">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">
                            <img class="stat-icon" src="./assets/sunrise-svgrepo-com.png" alt="" width="20" height="20">
                            Sunrise
                        </span>
                        <span class="stat-value" id="sunrise">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">
                            <img class="stat-icon" src="./assets/uv-cut-svgrepo-com.png" alt="" width="20" height="20">
                            UV Index
                        </span>
                        <span class="stat-value" id="uv">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">
                            <img class="stat-icon" src="./assets/cloud-rain-alt-1-svgrepo-com.png" alt="" width="20" height="20">
                            Rain Chance
                        </span>
                        <span class="stat-value" id="chance-of-rain">—</span>
                    </div>
                    <div class="stat">
                        <span class="stat-label">
                            <img class="stat-icon" src="./assets/sunset-svgrepo-com.png" alt="" width="20" height="20">
                            Sunset
                        </span>
                        <span class="stat-value" id="sunset">—</span>
                    </div>
                </div>
            </section>

            <section class="card hourly-card" aria-label="Hourly forecast">
                <h2 class="section-label">Next 24 Hours</h2>
                <div class="hourly-scroll" id="hourly-forecast"></div>
            </section>

            <section class="card forecast-card" aria-label="7-day forecast">
                <h2 class="section-label">7-Day Forecast</h2>
                <div class="weather-forecast" id="forecast"></div>
            </section>
        </main>

    </div>
    </div>

    <div id="loading" class="loading-overlay" hidden aria-live="polite">
        <div class="loading-spinner"></div>
        <p>Fetching weather…</p>
    </div>

    <div id="toast" class="toast" role="alert" hidden></div>

    <script src="script.js" defer></script>
</body>

</html>
